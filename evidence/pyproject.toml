[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimos-evidence"
version = "0.3.0"
description = "Claim OS Evidence desk: sourced comparable-sales evidence packets for property-tax appeals"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1", "numpy>=1.26", "pyarrow>=14", "reportlab>=4.0", "pypdf>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
claimevidence = "claimevidence.cli:main"

[tool.setuptools.packages.find]
include = ["claimevidence*"]
